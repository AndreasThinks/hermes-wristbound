name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble SDK
        run: |
          uv tool install pebble-tool
          yes | pebble sdk install latest
      - name: Build watchapp
        working-directory: watch
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: watch-pbw
          path: watch/build/watch.pbw

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble SDK
        run: |
          uv tool install pebble-tool
          yes | pebble sdk install latest
      - name: Unit tests
        working-directory: pebble-plugin
        run: node --test test/*.test.js
      - name: Build plugin
        working-directory: pebble-plugin
        run: pebble build
      - name: Run in the Pebble plugin host against a scripted Hermes
        working-directory: pebble-plugin
        run: NO_PROXY='*' "$(dirname "$(readlink -f "$(which pebble)")")/python" tools/emulator_e2e.py build/pebble-plugin.pbw
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-plugin-pbw
          path: pebble-plugin/build/pebble-plugin.pbw

  hermes-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: hermes-plugin
        run: |
          pip install pytest fastapi httpx
          python -m pytest -q tests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The runner image ships the Android SDK; install the platform PebbleKit 2 needs.
      - name: Install SDK platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: companion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Release plan tests
        working-directory: .github/scripts
        run: |
          pip install pytest
          python -m pytest -q test_release_plan.py
